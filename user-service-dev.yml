server:
  port: ${CUSTOM.SERVER.PORT:9030}

#Mongo DB Configuration
spring:
  data:
    mongodb:
      uri: mongodb://robin:robin@mongo-service:27017/mitocode?authSource=mitocode

#Configuracion de eureka
eureka:
  client:
    fetchRegistry: true
    registerWithEureka: true
    serviceUrl:
      defaultZone: ${EUREKA.SERVER.HOST:http://localhost:8761/eureka} 